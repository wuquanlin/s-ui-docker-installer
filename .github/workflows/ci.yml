name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: |
          shellcheck -x install.sh lib/*.sh scripts/* tests/*.sh
      - name: Smoke tests
        run: |
          bash tests/smoke.sh
          bash tests/network-selection.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject likely live deployment files
        run: |
          test -z "$(find . -type f \( -name '*.db' -o -name '*.sqlite' \) -print)"
          ! grep -RInE 'wql\.us|BEGIN OPENSSH PRIVATE KEY|gho_[A-Za-z0-9]+' \
            --exclude-dir=.git --exclude='development-*' --exclude='ci.yml' .
